name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  GROQ_API_KEY: "ci-test-key-not-used"
  DATABASE_URL: "postgresql+psycopg2://healthtech:healthtech@localhost:5432/healthtech_db"
  ENVIRONMENT: "test"

jobs:
  # ── Lint & Format ──────────────────────────────────────────────────────────────
  lint:
    name: "Lint & Format (ruff)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/

  # ── Type Check ─────────────────────────────────────────────────────────────────
  typecheck:
    name: "Type Check (mypy)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Type check with mypy
        # --ignore-missing-imports: third-party stubs not always available
        # --no-error-summary: cleaner output in CI logs
        # --exclude: skip generated/migration files
        run: |
          uv run mypy src/ \
            --ignore-missing-imports \
            --no-error-summary \
            --exclude 'migrations/'

  # ── Tests ──────────────────────────────────────────────────────────────────────
  test:
    name: "Unit & Integration Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pytest with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ── Docker Build ───────────────────────────────────────────────────────────────
  docker:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t healthtech-agent-orchestrator:ci .

      - name: Verify image starts (no DB smoke test — DB not available in CI)
        run: |
          docker run -d \
            --name healthtech_ci \
            -e GROQ_API_KEY=ci-test \
            -e DATABASE_URL=postgresql+psycopg2://x:x@localhost/x \
            -e ENVIRONMENT=test \
            -p 8000:8000 \
            healthtech-agent-orchestrator:ci
          # Give uvicorn time to boot even without DB (graceful degradation)
          sleep 8
          # Check process is still running (exit code 0 = container alive)
          docker inspect healthtech_ci --format='{{.State.Status}}' | grep -q running
          docker stop healthtech_ci
