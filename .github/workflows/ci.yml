name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src tests scripts
      - run: uv run pytest --cov=src --cov-report=term-missing

  e2e:
    name: Docker Compose end-to-end (Postgres)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres and the API
        run: docker compose up --build --detach --wait
      - name: Full workflow, with an API restart while the doctor's decision is pending
        run: python3 scripts/e2e.py http://localhost:8000 --restart-cmd "docker compose restart api"
      - name: Tampering with a stored audit entry is reported to readers
        run: |
          set -euo pipefail
          thread=$(curl -sf -X POST localhost:8000/api/v1/prescriptions -H 'Content-Type: application/json' \
            -d '{"prescription_id":"RX-TAMPER","patient_symptoms":"fiebre","patient_allergies":[]}' | jq -r .thread_id)
          test "$(curl -sf localhost:8000/api/v1/prescriptions/$thread | jq .audit_chain_valid)" = true
          docker compose exec -T postgres psql -U healthtech -d healthtech_db -v ON_ERROR_STOP=1 -c \
            "UPDATE audit_logs SET details = replace(details, 'Paracetamol', 'Morfina') WHERE prescription_id = 'RX-TAMPER'"
          curl -sf localhost:8000/api/v1/prescriptions/$thread/audit | jq -c '{valid, detail}'
          test "$(curl -sf localhost:8000/api/v1/prescriptions/$thread | jq -c '[.status, .audit_chain_valid, .proposed_medication]')" = '["INVALID",false,null]'
      - name: API logs
        if: always()
        run: docker compose logs api
