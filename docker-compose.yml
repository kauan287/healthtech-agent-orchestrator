services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthtech
      POSTGRES_PASSWORD: healthtech
      POSTGRES_DB: healthtech_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthtech -d healthtech_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://healthtech:healthtech@postgres:5432/healthtech_db
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-dev-only-audit-signing-key-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
