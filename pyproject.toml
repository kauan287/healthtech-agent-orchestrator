[project]
name = "healthtech-agent-orchestrator"
version = "1.0.0"
description = "Production-grade AI Agent Orchestration backend for medical prescription workflows — LangGraph, FastAPI, PostgreSQL, HITL, cryptographic audit chains."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kauan287" }]
keywords = ["ai", "agents", "healthtech", "langgraph", "fastapi", "orchestration", "human-in-the-loop"]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.13",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert statements in tests

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests — fast, no external dependencies",
    "integration: Integration tests — require FastAPI TestClient + SQLite fixture",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["src/main.py", "src/db/__init__.py", "src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
