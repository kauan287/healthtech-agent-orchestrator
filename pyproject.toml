[project]
name = "healthtech-agent-orchestrator"
version = "1.1.0"
description = "Multi-agent prescription review with LangGraph: AI triage and safety agents, mandatory doctor sign-off, and an HMAC-signed audit chain."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kauan287" }]
keywords = ["ai", "agents", "healthtech", "langgraph", "fastapi", "orchestration", "human-in-the-loop"]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.140.13",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.9",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # allow assert statements in tests

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
